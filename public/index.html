.citrus{position:absolute;width:118px;height:118px;top:31px;fill:none;stroke:#aac28b;stroke-width:2;opacity:.96;pointer-events:none}
.citrus.left{left:0;transform:rotate(-18deg)}.citrus.right{right:0;transform:scaleX(-1) rotate(-18deg)}
.citrus .fruit{fill:#e6a441;stroke:#ffdc7d;stroke-width:1.5}.citrus .leaf{fill:#698f6d;stroke:#a1bc88;stroke-width:1}

.label{font-size:15px;letter-spacing:.1px;margin:0 0 13px;text-align:center;color:#294a3c}

.tiny{font-size:11px;color:#7a766c;margin-top:23px}
