name: "Marché Radar V4 — cockpit et dossiers"
on:
  pull_request:
    paths:
      - "marcheradar/**"
      - ".github/workflows/marcheradar-v4-tests.yml"
  push:
    branches:
      - "feature/marcheradar-cockpit-20261027"
      - "feature/marcheradar-v4b-quickread-hors-sujet-20261028"
      - "main"
      - "feature/marcheradar-reliability-20261028"
    paths:
      - "marcheradar/index.html"
      - "marcheradar/cockpit-v4.js"
      - "marcheradar/cockpit-v4.css"
      - "marcheradar/tests/**"
      - "marcheradar/tools/**"
      - "marcheradar/detail-phase2.js"
      - "marcheradar/followup-backup.js"
      - ".github/workflows/marcheradar-v4-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Contrôler la syntaxe et la typologie"
        run: |
          node --check marcheradar/cockpit-v4.js
          node --check marcheradar/followup-backup.js
          node --check marcheradar/publication-filters.js
          node --check marcheradar/qualification.js
          node --check marcheradar/source-health.js
          node --check marcheradar/sources-dashboard.js
          node --check marcheradar/tests/cockpit-v4-browser.cjs
          node --test marcheradar/tests/*.test.cjs
          node marcheradar/tools/test-collector.cjs
          node marcheradar/tools/test-bosa.cjs
          node marcheradar/tools/test-expanded.cjs
          node marcheradar/tools/test-local-watch.cjs
      - name: "Préparer Chromium isolé"
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: "Tester le cockpit et la navigation réelle"
        run: node marcheradar/tests/cockpit-v4-browser.cjs
      - name: "Tester le panneau au 25e marché et les sources par province"
        run: node marcheradar/tests/ux-sources-browser.cjs
      - name: "Vérifier les qualifications et les exclusions automatiques réversibles"
        run: node marcheradar/tests/quality-browser.cjs
      - name: "Tester les filtres source puis nature de publication"
        run: node marcheradar/tests/source-type-browser.cjs
      - name: "Tester la sauvegarde et la restauration du suivi"
        run: node marcheradar/tests/followup-backup-browser.cjs
      - name: "Tester le suivi des marchés existant"
        run: node marcheradar/tests/phase1-browser.cjs
      - name: "Tester les fiches documentaires existantes"
        run: node marcheradar/tests/phase2-browser.cjs
      - name: "Tester la préservation documentaire"
        run: |
          node --test marcheradar/tests/phase3a-bosa.test.cjs
          node --test marcheradar/tests/phase3b-evidence.test.cjs
      - name: "Conserver les captures"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marche-radar-v4-screenshots
          retention-days: 7
          if-no-files-found: ignore
          path: |
            marcheradar/tests/source-type-bosa-attribution.png
            marcheradar/tests/qualification-kdrix.png
            marcheradar/tests/exclusions-filtre.png
            marcheradar/tests/ux-preview-25th.png
            marcheradar/tests/sources-dashboard.png
            marcheradar/tests/cockpit-v4-desktop.png
            marcheradar/tests/cockpit-v4-mobile.png
            marcheradar/tests/cockpit-v4b-mobile.png
            marcheradar/tests/followup-backup-preview.png
            marcheradar/tests/municipal-document-versions.png
