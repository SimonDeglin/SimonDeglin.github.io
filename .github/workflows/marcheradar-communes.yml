name: "MarchéRadar — découverte des conseils communaux"
on:
  workflow_dispatch:
    inputs:
      province:
        description: "Province à contrôler (lot progressif)"
        type: choice
        options: [all, brabant_wallon, hainaut, liege, luxembourg, namur]
        default: all
        required: true
      commune:
        description: "Code INS de cinq chiffres (facultatif, une commune seulement)"
        type: string
        default: ""
  schedule:
    - cron: "43 1,5,9,13,17,21 * * *"
permissions:
  contents: write
concurrency:
  group: marcheradar-ted-data
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Vérifier les dates, la rotation et la conservation des dossiers"
        run: node --test marcheradar/tests/*.test.cjs
      - name: "Préparer la lecture des PDF"
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          fi
      - name: "Collecter les publications récentes par lots de communes"
        id: collect
        env:
          COMMUNES_BATCH: "12"
          COMMUNES_PROVINCE: ${{ inputs.province || 'all' }}
          COMMUNES_INS: ${{ inputs.commune || '' }}
        run: node marcheradar/tools/communal-batch.cjs
      - name: "Enregistrer seulement les changements valides"
        if: always() && steps.collect.outcome == 'success'
        shell: bash
        run: |
          node -e "for(const p of ['marcheradar/data.json','marcheradar/communes.json'])JSON.parse(require('fs').readFileSync(p))"
          if git diff --quiet -- marcheradar/communes.json marcheradar/data.json; then exit 0; fi
          git config user.name "marcheradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marcheradar/communes.json marcheradar/data.json
          git commit -m "MarchéRadar: collecte communale récente PDF et HTML [skip ci]"
          git push origin HEAD:main
      - name: "Bilan de couverture"
        if: always()
        run: |
          node -e "const d=require('./marcheradar/data.json');console.log(JSON.stringify(d.sources.COMMUNES_DOCUMENTS,null,2))" >> "$GITHUB_STEP_SUMMARY"
          echo "Rotation : 12 communes, 3 en parallèle ; priorité aux documents des 3 derniers mois. Couverture non exhaustive, erreurs conservées." >> "$GITHUB_STEP_SUMMARY"
