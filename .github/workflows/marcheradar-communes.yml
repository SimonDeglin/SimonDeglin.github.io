name: "MarchéRadar — découverte des conseils communaux"
on:
  workflow_dispatch:
    inputs:
      province:
        description: "Province à contrôler (lot progressif)"
        type: choice
        options: [all, brabant_wallon, hainaut, liege, luxembourg, namur]
        default: all
        required: true
      commune:
        description: "Code INS de cinq chiffres (facultatif, une commune seulement)"
        type: string
        default: ""
  schedule:
    - cron: "43 1,5,9,13,17,21 * * *"
permissions:
  contents: write
concurrency:
  group: marcheradar-ted-data
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: "22"
        continue-on-error: true
      - name: "Vérifier la conservation des dossiers et versions"
        id: tests
        if: steps.node.outcome == 'success'
        run: node --test marcheradar/tests/municipal-versions.test.cjs marcheradar/tests/sources-health.test.cjs marcheradar/tests/communes-scope.test.cjs
        continue-on-error: true
      - name: "Découvrir progressivement les pages des conseils"
        id: collect
        if: steps.tests.outcome == 'success'
        env:
          COMMUNES_BATCH: "12"
          COMMUNES_PROVINCE: ${{ inputs.province || 'all' }}
          COMMUNES_INS: ${{ inputs.commune || '' }}
        run: node marcheradar/tools/communes-discovery.cjs
        continue-on-error: true
      - name: "Préparer la lecture des PDF"
        id: pdf
        if: steps.collect.outcome == 'success'
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          fi
        continue-on-error: true
      - name: "Lire les documents communaux accessibles"
        id: documents
        if: steps.pdf.outcome == 'success'
        env:
          COMMUNES_DOC_BATCH: "4"
          COMMUNES_PROVINCE: ${{ inputs.province || 'all' }}
          COMMUNES_INS: ${{ inputs.commune || '' }}
        run: node marcheradar/tools/communes-documents.cjs
        continue-on-error: true
      - name: "Enregistrer seulement les changements valides"
        if: steps.collect.outcome == 'success' || steps.documents.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if git diff --quiet -- marcheradar/communes.json marcheradar/data.json; then exit 0; fi
          git config user.name "marcheradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marcheradar/communes.json marcheradar/data.json
          git commit -m "MarchéRadar: découverte des pages communales [skip ci]"
          git push origin HEAD:main
      - name: "Résultat sans mail d'échec"
        if: always()
        shell: bash
        env:
          COMMUNES_PROVINCE: ${{ inputs.province || 'all' }}
          COMMUNES_INS: ${{ inputs.commune || '' }}
          RESULT: ${{ steps.collect.outcome }}
          DOCUMENTS: ${{ steps.documents.outcome }}
        run: |
          echo "Découverte communale : $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Lecture et contrôle des versions PDF : $DOCUMENTS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DOCUMENTS" != "success" ]; then
            echo "::warning::Contrôle documentaire non terminé ; dernière version exploitable conservée."
          fi
          echo "Périmètre : province $COMMUNES_PROVINCE, commune $COMMUNES_INS" >> "$GITHUB_STEP_SUMMARY"
          echo "Les sites inventoriés ne sont pas automatiquement des sites surveillés." >> "$GITHUB_STEP_SUMMARY"
