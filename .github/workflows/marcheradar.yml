name: "MarchéRadar — veille TED + BOSA"

# Exécution uniquement sur planification ou lancement manuel.
# Les commits de développement ne déclenchent plus de collecte supplémentaire.
on:
  workflow_dispatch:
    inputs:
      jours:
        description: "Nombre de jours à analyser (14, 30 ou 100)"
        type: choice
        required: true
        options:
          - "14"
          - "30"
          - "100"
        default: "14"
  schedule:
    - cron: "17 5,11,16 * * *"

permissions:
  contents: write

concurrency:
  group: marcheradar-ted-data
  cancel-in-progress: false

jobs:
  collect:
    name: "Collecte TED sans notifications d'échec"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Erreurs visibles dans le journal sans e-mail d'échec GitHub Actions.
    continue-on-error: true

    steps:
      - name: "Récupérer le dépôt"
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: "Préparer Node.js"
        id: node
        if: steps.checkout.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
        continue-on-error: true

      - name: "Vérifier le programme"
        id: tests
        if: steps.node.outcome == 'success'
        run: |
          node marcheradar/tools/test-collector.cjs
          node marcheradar/tools/test-bosa.cjs
          node --test marcheradar/tests/v4c-bosa-deadline.test.cjs
          node marcheradar/tools/test-local-watch.cjs
        continue-on-error: true

      - name: "Collecter les avis TED"
        id: collect
        if: steps.tests.outcome == 'success'
        env:
          MARCHE_RADAR_DAYS: ${{ github.event.inputs.jours || '' }}
        run: node marcheradar/tools/collect-ted.cjs
        continue-on-error: true

      - name: "Préparer Chrome pour le bulletin BOSA"
        id: browser
        if: steps.tests.outcome == 'success'
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
        continue-on-error: true

      - name: "Collecter les avis publics BOSA"
        id: bosa
        if: steps.browser.outcome == 'success'
        env:
          BOSA_DAYS: "14"
          BOSA_MAX_PAGES: "115"
        run: node marcheradar/tools/bosa-browser.cjs
        continue-on-error: true

      - name: "Vérifier la lecture des PDF publics locaux"
        id: pdf
        if: steps.collect.outcome == 'success'
        shell: bash
        run: |
          if command -v pdftotext >/dev/null 2>&1; then
            echo "Poppler disponible."
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
        continue-on-error: true

      - name: "Veille pilote des décisions publiques locales"
        id: local
        if: steps.pdf.outcome == 'success'
        run: node marcheradar/tools/local-watch.cjs
        continue-on-error: true

      - name: "Répertorier les documents BOSA publics sans inventer de téléchargement"
        id: documents
        if: steps.browser.outcome == 'success'
        run: node marcheradar/tools/bosa-documents-enrich.cjs --browser --write
        continue-on-error: true

      - name: "Vérifier les échéances BOSA à la source (page + API concordantes)"
        id: deadlines
        if: steps.browser.outcome == 'success'
        run: node marcheradar/tools/bosa-deadline-enrich.cjs --write
        continue-on-error: true

      - name: "Publier uniquement les données valides"
        id: publish
        if: steps.collect.outcome == 'success' || steps.bosa.outcome == 'success' || steps.bosa.outcome == 'failure' || steps.local.outcome == 'success' || steps.documents.outcome == 'success' || steps.deadlines.outcome == 'success'
        shell: bash
        run: |
          if git diff --quiet -- marcheradar/data.json; then
            echo "Aucune nouvelle donnée à publier."
            exit 0
          fi
          git config user.name "marcheradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marcheradar/data.json
          git commit -m "MarchéRadar: synchronisation TED et BOSA [skip ci]"
          git push origin HEAD:main
        continue-on-error: true

      - name: "Rapport discret de collecte"
        if: always()
        shell: bash
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          NODE_RESULT: ${{ steps.node.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
          COLLECT_RESULT: ${{ steps.collect.outcome }}
          BOSA_RESULT: ${{ steps.bosa.outcome }}
          LOCAL_RESULT: ${{ steps.local.outcome }}
          DOCUMENTS_RESULT: ${{ steps.documents.outcome }}
          DEADLINES_RESULT: ${{ steps.deadlines.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        run: |
          {
            echo "### MarchéRadar — rapport de collecte"
            echo ""
            echo "| Étape | Résultat |"
            echo "| --- | --- |"
            echo "| Dépôt | $CHECKOUT_RESULT |"
            echo "| Node.js | $NODE_RESULT |"
            echo "| Tests | $TESTS_RESULT |"
            echo "| Collecte TED | $COLLECT_RESULT |"
            echo "| Tentative BOSA | $BOSA_RESULT |"
            echo "| Sources locales (pilote) | $LOCAL_RESULT |"
            echo "| Métadonnées documents BOSA | $DOCUMENTS_RESULT |"
            echo "| Échéances officielles BOSA | $DEADLINES_RESULT |"
            echo "| Publication | $PUBLISH_RESULT |"
            echo ""
            if [ "$COLLECT_RESULT" != "success" ] || [ "$PUBLISH_RESULT" = "failure" ]; then
              echo "⚠️ **La collecte n'a pas été publiée.** Le dernier fichier valide est conservé."
              echo ""
              echo "La cause est consultable dans les étapes précédentes."
            else
              echo "Collecte effectuée. Voir le journal pour le nombre d'avis traités."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COLLECT_RESULT" != "success" ] || [ "$PUBLISH_RESULT" = "failure" ]; then
            echo "::warning::Collecte MarchéRadar non publiée. Dernières données valides conservées."
          fi
