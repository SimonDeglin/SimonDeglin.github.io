name: "MarchéRadar — diagnostic BOSA"
on:
  push:
    branches: [main]
    paths:
      - "marcheradar/tools/probe-bosa.cjs"
      - "marcheradar/tools/probe-bosa-browser.cjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
        continue-on-error: true
      - name: "Examiner les ressources publiques BOSA"
        id: probe
        run: node marcheradar/tools/probe-bosa.cjs
        continue-on-error: true
      - name: "Installer Chromium pour observer l'interface publique"
        id: chrome
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
        continue-on-error: true
      - name: "Examiner les requêtes publiques du navigateur"
        if: steps.chrome.outcome == 'success'
        run: node marcheradar/tools/probe-bosa-browser.cjs
        continue-on-error: true
      - name: "Enregistrer le rapport"
        if: always()
        run: |
          if [ -f marcheradar/tools/bosa-browser-report.json ]; then
            git add marcheradar/tools/bosa-browser-report.json
          fi
          if [ -f marcheradar/tools/bosa-discovery.json ] || [ -f marcheradar/tools/bosa-browser-report.json ]; then
            git config user.name "marcheradar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add marcheradar/tools/bosa-discovery.json
            if ! git diff --cached --quiet; then
              git commit -m "MarchéRadar: diagnostic accès public BOSA [skip ci]"
              git push origin HEAD:main || true
            fi
          fi
        continue-on-error: true
