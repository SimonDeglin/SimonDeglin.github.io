name: "MarchéRadar — diagnostic public BOSA"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/marcheradar-bosa-probe.yml"
      - "marcheradar/tools/probe-bosa-public.cjs"
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
        continue-on-error: true
      - name: "Tester BOSA, sans identifiants et sans modifier la liste des marchés"
        run: node marcheradar/tools/probe-bosa-public.cjs
        continue-on-error: true
      - name: "Enregistrer un compte-rendu non confidentiel"
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f marcheradar/bosa-diagnostic.json ]; then
            echo '{"status":"diagnostic_indisponible"}' > marcheradar/bosa-diagnostic.json
          fi
          git config user.name "marcheradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marcheradar/bosa-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "MarchéRadar : diagnostic accès BOSA [skip ci]"
            git push origin HEAD:main || true
          fi
