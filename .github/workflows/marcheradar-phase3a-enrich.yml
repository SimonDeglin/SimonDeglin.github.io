name: "MarchéRadar — Tests documentaires 3A"
on:
  push:
    branches:
      - main
      - feature/marcheradar-phase3a-documents-20261015
    paths:
      - "marcheradar/tools/bosa-documents-enrich.cjs"
      - "marcheradar/tools/bosa-public.cjs"
      - "marcheradar/tools/collect-ted.cjs"
      - "marcheradar/tests/**"
      - "marcheradar/data.json"
      - "marcheradar/detail-phase2.js"
      - ".github/workflows/marcheradar.yml"
      - ".github/workflows/marcheradar-phase3a-enrich.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Syntaxe et tests de métadonnées officielles"
        run: |
          node --check marcheradar/tools/bosa-documents-enrich.cjs
          node --test marcheradar/tests/phase3a-bosa.test.cjs
      - name: "Préparer un navigateur isolé"
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: "Tests de non-régression Phase 1"
        run: node marcheradar/tests/phase1-browser.cjs
      - name: "Tests de non-régression Phase 2"
        run: node marcheradar/tests/phase2-browser.cjs
