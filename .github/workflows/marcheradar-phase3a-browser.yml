name: "MarchéRadar 3A — Navigateur officiel"
on:
  push:
    branches: ["feature/marcheradar-phase3a-documents-20261015"]
    paths: ["marcheradar/tools/phase3a-browser-probe.cjs",".github/workflows/marcheradar-phase3a-browser.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium
      - name: Observer les pages publiques en JavaScript
        run: node marcheradar/tools/phase3a-browser-probe.cjs
      - name: Exporter les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marcheradar-phase3a-browser-results
          if-no-files-found: warn
          path: marcheradar/audit/phase3a-browser-probe.json
