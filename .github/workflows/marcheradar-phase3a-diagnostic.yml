name: "MarchéRadar 3A — Diagnostic sources"
on:
  push:
    branches: ["feature/marcheradar-phase3a-documents-20261015"]
    paths: ["marcheradar/tools/phase3a-diagnostic.cjs", ".github/workflows/marcheradar-phase3a-diagnostic.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate script syntax
        run: node --check marcheradar/tools/phase3a-diagnostic.cjs
      - name: Test real public sources without changing production data
        run: node marcheradar/tools/phase3a-diagnostic.cjs
      - name: Save verifiable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marcheradar-phase3a-source-audit
          if-no-files-found: warn
          path: |
            marcheradar/audit/phase3a-diagnostic.json
            marcheradar/audit/phase3a-diagnostic.md
