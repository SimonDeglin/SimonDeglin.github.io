name: "MarchéRadar — test navigateur public BOSA"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/marcheradar-bosa-browser-probe.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
        continue-on-error: true
      - name: "Installer navigateur de test"
        continue-on-error: true
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: "Analyser le bulletin public"
        continue-on-error: true
        run: node marcheradar/tools/bosa-browser-probe.cjs
      - name: "Archiver seulement le diagnostic public"
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f marcheradar/bosa-browser-diagnostic.json ]; then
            echo '{"status":"test_indisponible"}' > marcheradar/bosa-browser-diagnostic.json
          fi
          git config user.name "marcheradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marcheradar/bosa-browser-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "MarchéRadar : résultat test navigateur BOSA [skip ci]"
            git push origin HEAD:main || true
          fi
