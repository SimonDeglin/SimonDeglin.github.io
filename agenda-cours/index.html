<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f3f5ef"><meta name="apple-mobile-web-app-capable" content="yes"><title>Mon agenda</title></head><body><main style="padding:18px 8px">
<div id="study-agenda">
  <header><div><span class="eyebrow">MON AGENDA</span><h2>Une semaine à la fois.</h2></div><span class="avatar" aria-hidden="true">✦</span></header>
  <div class="monthbar"><div><strong id="period">Octobre 2026</strong><small id="range">Du 5 au 11 octobre</small></div><div class="arrows"><button aria-label="Semaine précédente" id="prev">‹</button><button aria-label="Semaine suivante" id="next">›</button></div></main>
  <div class="switch"><button class="active" data-view="week">Semaine</button><button data-view="month">Mois</button><button data-view="tasks">À rendre</button></div>
  <div id="days" class="days"></div>
  <div class="dayheading"><h3 id="daytitle">Mardi 6 octobre</h3><span id="count"></span></div>
  <div id="events" aria-live="polite"></div>
  <button id="add" class="add"><span aria-hidden="true">＋</span> Ajouter un événement</button>
  <form id="editor" hidden>
    <div class="formhead"><strong id="formtitle">Nouvel événement</strong><button type="button" id="close" aria-label="Fermer">×</button></div>
    <label>Titre<input name="title" required placeholder="Ex. : cours de communication"></label>
    <div class="formrow"><label>Date<input name="date" type="date" required></label><label>Type<select name="type"><option value="course">Cours</option><option value="task">Travail à rendre</option><option value="job">Job étudiant</option><option value="personal">Personnel</option></select></label></div>
    <div class="formrow"><label>Début<input name="start" type="time" value="09:00" required></label><label>Fin<input name="end" type="time" value="11:00" required></label></div>
    <label>Lieu<input name="place" placeholder="Local, adresse…"></label><label>Note<textarea name="note" rows="3" placeholder="Consigne, matériel à prendre…"></textarea></label><div class="formrow"><label>Couleur du cours<select name="color"><option value="#eaf0e5">Sauge</option><option value="#e3edf8">Bleu</option><option value="#f0ebf9">Lavande</option><option value="#fbede2">Pêche</option><option value="#f9e5ec">Rose</option><option value="#f6f0d6">Jaune</option></select></label><label class="cancelcheck"><input name="cancelled" type="checkbox"> Événement annulé</label></div>
    <div class="formactions"><button type="button" id="remove" hidden>Supprimer</button><button class="save" type="submit">Enregistrer</button></div>
  </form>
  <footer><span><span aria-hidden="true">▦</span> Agenda</span><button id="backup" type="button">Sauvegarde</button></footer><div id="backup-panel" hidden><p>Les événements sont enregistrés sur cet appareil.</p><button id="export" type="button">Exporter une sauvegarde</button><label>Restaurer une sauvegarde<input id="import" type="file" accept="application/json,.json"></label><p id="notice" role="status"></p></div>
</div></div>
<style>
#study-agenda{--paper:light-dark(#fffdfa,#20221f);--ink:light-dark(#28352c,#eff3ed);--sub:light-dark(#68756b,#b2bdb3);--line:light-dark(#e6e9e2,#40463f);--sage:light-dark(#eaf0e5,#303e2f);--green:light-dark(#395840,#c2dcbd);--peach:light-dark(#fbede2,#49372b);--lilac:light-dark(#f0ebf9,#3b344b);font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:26px;max-width:430px;margin:auto;padding:24px 20px 0;box-shadow:0 16px 42px #0000000c;font-size:14px;position:relative;overflow:hidden}
#study-agenda *{box-sizing:border-box}#study-agenda button{font:inherit;cursor:pointer;color:inherit}#study-agenda header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}#study-agenda .eyebrow{font-size:11px;letter-spacing:2px;color:var(--sub);font-weight:600}#study-agenda h2{font-size:23px;line-height:1.25;letter-spacing:-.7px;margin:8px 0 0;font-weight:600}#study-agenda .avatar{background:var(--sage);color:var(--green);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-weight:600;flex-shrink:0}#study-agenda .monthbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}#study-agenda .monthbar strong{font-size:18px;font-weight:600}#study-agenda small{display:block;color:var(--sub);font-size:12px;margin-top:4px}#study-agenda .arrows{display:flex;gap:6px}#study-agenda .arrows button{width:38px;height:38px;background:transparent;border:1px solid var(--line);border-radius:12px;font-size:24px}#study-agenda .switch{display:flex;background:var(--sage);padding:4px;border-radius:13px;gap:4px;margin-bottom:20px}#study-agenda .switch button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:10px;color:var(--sub);font-size:13px}#study-agenda .switch .active{background:var(--paper);color:var(--ink);box-shadow:0 2px 5px #00000008}#study-agenda .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:25px}#study-agenda .days button{background:transparent;border:0;border-radius:13px;padding:9px 0;min-height:58px}#study-agenda .days small{margin:0 0 7px;font-size:11px}#study-agenda .days b{font-weight:500;font-size:16px}#study-agenda .days .selected{background:var(--green);color:var(--paper)}#study-agenda .days .selected small{color:var(--paper)}#study-agenda .dot{display:block;margin:5px auto 0;width:4px;height:4px;border-radius:50%;background:currentColor}#study-agenda .days.month{gap:3px}#study-agenda .days.month button{min-height:43px;padding:5px 0}#study-agenda .dayheading{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:8px}#study-agenda h3{font-size:15px;font-weight:600;margin:0}#study-agenda #count{font-size:11px;color:var(--sub)}#study-agenda .event{width:100%;text-align:left;background:var(--sage);border:0;border-radius:16px;margin-bottom:11px;padding:16px;display:flex;gap:13px;align-items:flex-start}#study-agenda .event.task{background:var(--peach)}#study-agenda .event.personal{background:var(--lilac)}#study-agenda .time{font-size:12px;min-width:43px;padding-top:2px;font-weight:500}#study-agenda .time small{font-size:11px;color:var(--sub);margin-top:6px}#study-agenda .detail{min-width:0;flex:1}#study-agenda .detail .kind{font-size:10px;letter-spacing:1px;color:var(--sub);text-transform:uppercase}#study-agenda .detail strong{display:block;margin-top:5px;font-size:15px;font-weight:600;overflow-wrap:anywhere}#study-agenda .detail small{margin-top:7px}#study-agenda .event .chevron{color:var(--sub);margin-top:19px}#study-agenda .empty{padding:22px 0 35px;text-align:center;color:var(--sub)}#study-agenda .add{width:100%;padding:14px;border-radius:14px;background:var(--green);color:var(--paper);border:0;margin:12px 0 23px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500}#study-agenda svg{width:17px;height:17px}#study-agenda footer{border-top:1px solid var(--line);padding:17px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}#study-agenda footer span:first-child{display:flex;gap:7px;align-items:center;color:var(--green);font-size:12px}#study-agenda .demo{font-size:10px;color:var(--sub)}#study-agenda form{border-top:1px solid var(--line);padding:18px 0 23px}#study-agenda form[hidden]{display:none}#study-agenda .formhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}#study-agenda .formhead button{border:0;background:transparent;font-size:24px;width:36px;height:36px}#study-agenda label{display:block;font-size:12px;color:var(--sub);margin-bottom:12px;min-width:0}#study-agenda input,#study-agenda select{display:block;width:100%;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:5px}#study-agenda .formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}#study-agenda .formactions{display:flex;justify-content:flex-end;gap:10px}#study-agenda .formactions button{border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--paper)}#study-agenda .formactions .save{background:var(--green);color:var(--paper);border:0}#study-agenda button:focus-visible{outline:2px solid var(--green);outline-offset:3px}@media(pointer:coarse){#study-agenda .arrows button{min-width:44px;min-height:44px}#study-agenda .switch button{min-height:44px}}

#study-agenda .event.job{background:#e3edf8}#study-agenda .cancelled .detail strong{text-decoration:line-through}#study-agenda .cancelled{opacity:.62}#study-agenda .note{white-space:pre-wrap;overflow-wrap:anywhere}#study-agenda textarea{display:block;width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:5px;color:var(--ink);background:var(--paper);resize:vertical}#study-agenda .cancelcheck{display:flex;align-items:center;gap:8px;padding-top:14px}#study-agenda .cancelcheck input{width:20px;height:20px;margin:0}#study-agenda input[type=color]{height:42px;padding:4px}#study-agenda #backup{border:0;background:transparent;color:var(--sub);padding:10px;font-size:12px}#study-agenda #backup-panel{border-top:1px solid var(--line);padding:12px 0;font-size:12px;color:var(--sub)}#study-agenda #export{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-bottom:16px}#study-agenda .days[hidden]{display:none}body{margin:0;background:#f3f5ef;font-family:system-ui,sans-serif;color:#28352c;color-scheme:light}#study-agenda{--paper:#fffdfa;--ink:#28352c;--sub:#68756b;--line:#e6e9e2;--sage:#eaf0e5;--green:#395840;--peach:#fbede2;--lilac:#f0ebf9}button,input,select,textarea{-webkit-tap-highlight-color:transparent}#study-agenda input[type=date],#study-agenda input[type=time]{max-width:100%}#study-agenda .empty{padding:28px 12px;line-height:1.6}#study-agenda #backup-panel[hidden]{display:none}
</style>
<script>
(()=>{
const root=document.getElementById('study-agenda'),q=s=>root.querySelector(s),form=q('#editor');
const now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
let selected=today,view='week',editing=null;
const seedEvents=[];
let events=[],saved;
try{saved=JSON.parse(localStorage.getItem('study-agenda-v1')||'null');events=Array.isArray(saved)?saved:seedEvents;}catch(e){events=seedEvents;}
const types={course:'Cours',task:'À rendre',job:'Job étudiant',personal:'Personnel'};
function persist(){try{localStorage.setItem('study-agenda-v1',JSON.stringify(events));return true;}catch(e){alert('Enregistrement impossible sur cet appareil. Exportez une sauvegarde avant de fermer.');return false;}}
const date=s=>new Date(s+'T12:00:00'),iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),fmt=(d,o)=>d.toLocaleDateString('fr-BE',o),cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function render(){
const base=date(selected);base.setDate(base.getDate()-((base.getDay()+6)%7));const last=new Date(base);last.setDate(base.getDate()+6);q('#period').textContent=cap(fmt(date(selected),{month:'long',year:'numeric'}));q('#range').textContent=view==='tasks'?'Les prochaines échéances':'Du '+base.getDate()+' au '+last.getDate()+' '+fmt(last,{month:'long'});
root.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const days=q('#days');days.replaceChildren();days.hidden=view==='tasks';days.classList.toggle('month',view==='month');let dates=[];
if(view==='month'){const d=date(selected);for(let n=1;n<=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();n++)dates.push(new Date(d.getFullYear(),d.getMonth(),n,12));const pad=(new Date(d.getFullYear(),d.getMonth(),1,12).getDay()+6)%7;for(let n=0;n<pad;n++)days.appendChild(document.createElement('span'));}else for(let n=0;n<7;n++){const d=new Date(base);d.setDate(base.getDate()+n);dates.push(d);}
dates.forEach(d=>{const s=iso(d),b=document.createElement('button');b.className=s===selected?'selected':'';b.setAttribute('aria-label',fmt(d,{weekday:'long',day:'numeric',month:'long'}));b.setAttribute('aria-pressed',s===selected);if(view==='week'){const label=document.createElement('small');label.textContent=cap(fmt(d,{weekday:'short'})).replace('.','');b.appendChild(label);}const num=document.createElement('b');num.textContent=d.getDate();b.appendChild(num);if(events.some(e=>e.date===s)){const dot=document.createElement('span');dot.className='dot';b.appendChild(dot);}b.onclick=()=>{selected=s;render();};days.appendChild(b);});
let list=events.filter(e=>view==='tasks'?e.type==='task'&&e.date>=today&&!e.cancelled:e.date===selected).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));q('#daytitle').textContent=view==='tasks'?'Travaux à rendre':cap(fmt(date(selected),{weekday:'long',day:'numeric',month:'long'}));q('#count').textContent=list.length+' événement'+(list.length>1?'s':'');const container=q('#events');container.replaceChildren();if(!list.length){const p=document.createElement('div');p.className='empty';p.textContent='Aucun événement. Ajoute un cours, un travail ou un créneau de job.';container.appendChild(p);}list.forEach(e=>{const b=document.createElement('button');b.className='event '+e.type+(e.cancelled?' cancelled':'');if(e.type==='course')b.style.background=e.color||'#eaf0e5';const time=document.createElement('div');time.className='time';time.textContent=e.start;const end=document.createElement('small');end.textContent=e.end;time.appendChild(end);const detail=document.createElement('div');detail.className='detail';const kind=document.createElement('span');kind.className='kind';kind.textContent=(e.cancelled?'Annulé · ':'')+types[e.type]+(view==='tasks'?' · '+fmt(date(e.date),{day:'numeric',month:'short'}):'');const title=document.createElement('strong');title.textContent=e.title;const place=document.createElement('small');place.textContent=e.place;detail.append(kind,title,place);if(e.note){const note=document.createElement('small');note.className='note';note.textContent=e.note;detail.appendChild(note);}const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='›';b.append(time,detail,arrow);b.onclick=()=>open(e);container.appendChild(b);});}
function open(e){editing=e?e.id:null;form.reset();form.hidden=false;q('#formtitle').textContent=e?'Modifier l’événement':'Nouvel événement';q('#remove').hidden=!e;const data=e||{title:'',date:selected,type:'course',start:'09:00',end:'11:00',place:'',note:'',color:'#eaf0e5'};for(const key of ['title','date','type','start','end','place','note','color'])form.elements.namedItem(key).value=data[key]||'';form.elements.namedItem('cancelled').checked=!!data.cancelled;form.scrollIntoView({behavior:'smooth',block:'start'});form.elements.namedItem('title').focus({preventScroll:true});}
q('#add').onclick=()=>open();q('#close').onclick=()=>form.hidden=true;q('#remove').onclick=()=>{if(!confirm('Supprimer cet événement ?'))return;events=events.filter(e=>e.id!==editing);persist();form.hidden=true;render();};form.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));if(data.end<data.start){form.elements.namedItem('end').setCustomValidity('La fin doit suivre le début.');form.reportValidity();return;}data.cancelled=form.elements.namedItem('cancelled').checked;const item={...data,id:editing||crypto.randomUUID()};if(item.type==='course'){const other=events.find(e=>e.type==='course'&&e.title.trim().toLowerCase()===item.title.trim().toLowerCase());if(!editing&&other)item.color=other.color;events.forEach(e=>{if(e.type==='course'&&e.title.trim().toLowerCase()===item.title.trim().toLowerCase())e.color=item.color;});}events=events.filter(e=>e.id!==editing);events.push(item);persist();selected=item.date;form.hidden=true;render();};form.elements.namedItem('end').oninput=()=>form.elements.namedItem('end').setCustomValidity('');
root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});q('#prev').onclick=()=>move(-1);q('#next').onclick=()=>move(1);function move(n){if(view==='month'){const d=date(selected);d.setDate(1);d.setMonth(d.getMonth()+n);selected=iso(d);}else{const d=date(selected);d.setDate(d.getDate()+n*7);selected=iso(d);}render();}q('#backup').onclick=()=>q('#backup-panel').hidden=!q('#backup-panel').hidden;
q('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,events},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='agenda-sauvegarde-'+today+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
q('#import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.events)||data.events.length>10000)throw Error();const ids=new Set();for(const item of data.events){if(!item||typeof item.id!=='string'&&typeof item.id!=='number'||ids.has(item.id)||!types[item.type]||typeof item.title!=='string'||!item.title.trim()||!/^\d{4}-\d{2}-\d{2}$/.test(item.date)||Number.isNaN(date(item.date).getTime())||iso(date(item.date))!==item.date||!/^([01]\d|2[0-3]):[0-5]\d$/.test(item.start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(item.end)||item.end<item.start||item.color&&!/^#[0-9a-fA-F]{6}$/.test(item.color)||item.place!=null&&typeof item.place!=='string'||item.note!=null&&typeof item.note!=='string')throw Error();ids.add(item.id);}if(!confirm('Remplacer les événements de cet appareil par la sauvegarde ?'))return;events=data.events;persist();render();q('#notice').textContent='Sauvegarde restaurée.';}catch(error){q('#notice').textContent='Fichier de sauvegarde invalide.';}e.target.value='';};
render();
})();
</script>
</body></html>
