<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>KDRIX — Sites récepteurs de terres</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;margin:0;display:grid;place-items:center;min-height:100vh;color:#34515d;background:#f4f7f8}#error{max-width:560px;padding:24px}button{padding:9px 14px}</style></head><body><div id="error">Chargement du module Terres…</div><script>
(async()=>{try{
const names=Array.from({length:11},(_,i)=>'chunk-'+String(i).padStart(2,'0')+'.txt');
const responses=await Promise.all(names.map(n=>fetch('./'+n,{cache:'no-cache'})));
for(let i=0;i<responses.length;i++)if(!responses[i].ok)throw Error('Fichier source '+names[i]+' indisponible ('+responses[i].status+')');
const html=(await Promise.all(responses.map(r=>r.text()))).join('');
if(!html.toLowerCase().includes('<!doctype html'))throw Error('Source HTML invalide');
document.open();document.write(html);document.close();
}catch(err){document.getElementById('error').innerHTML='<h2>Impossible de charger le module Terres</h2><p></p><button onclick="location.reload()">Réessayer</button>';document.querySelector('#error p').textContent=String(err);console.error(err)}})();
</script></body></html>
